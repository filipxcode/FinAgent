[project]
name = "finagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptopanic>=0.1.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "pydantic-ai>=2.21.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "tavily-python>=0.7.27",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
